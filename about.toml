# `cargo about`: the third-party licence notices shipped with the client binaries (release.yml). The same licences
# deny.toml allows.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Our own crates are covered by LICENSE-MIT and LICENSE-APACHE beside the binary.
private = { ignore = true }
ignore-build-dependencies = true
ignore-dev-dependencies = true
