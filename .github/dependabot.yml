# Weekly dependency updates, as pull requests into `dev` (new work never lands on `main` directly: docs/deploy.md).
# Security updates arrive as soon as an advisory is published, when Dependabot security updates are on.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      cargo: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directories: [/website, /status]
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
