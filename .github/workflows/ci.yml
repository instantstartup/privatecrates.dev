name: CI

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Configure git for the tests
        run: |
          git --version
          git config --global user.name "PrivateCrates CI"
          git config --global user.email "ci@privatecrates.dev"
          git config --global init.defaultBranch main
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Package the publishable crates
        run: cargo publish --dry-run --locked -p privatecrates-common -p cargo-credential-privatecrates -p privatecrates-verify

  website:
    name: Website (check, lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip when there is no website yet
        if: hashFiles('website/package.json') == ''
        working-directory: .
        run: echo "::notice::website/ does not exist; skipping."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('website/package.json') != ''
        with:
          node-version: 24
      - name: Enable pnpm (corepack, the version in package.json's packageManager)
        if: hashFiles('website/package.json') != ''
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable && pnpm --version
      - if: hashFiles('website/package.json') != ''
        run: pnpm install --frozen-lockfile
      - if: hashFiles('website/package.json') != ''
        run: pnpm check
      - if: hashFiles('website/package.json') != ''
        run: pnpm lint
      - if: hashFiles('website/package.json') != ''
        run: pnpm build

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip when there is no website yet
        if: hashFiles('website/package.json') == ''
        run: echo "::notice::website/ does not exist; the image needs it, so the Docker build is skipped."
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: hashFiles('website/package.json') != ''
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: hashFiles('website/package.json') != ''
        with:
          context: .
          push: false
          load: true
          tags: privatecrates:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and refuses to run without configuration
        if: hashFiles('website/package.json') != ''
        run: |
          if docker run --rm privatecrates:ci 2>err.txt; then
            echo "expected a configuration error" >&2
            exit 1
          fi
          cat err.txt
          grep -Eq 'Missing|not set' err.txt
