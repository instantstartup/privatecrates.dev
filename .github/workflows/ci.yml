name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # new advisories arrive without a push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  rust:
    name: Rust, open-source crates (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Configure git for the tests
        run: |
          git --version
          git config --global user.name "PrivateCrates CI"
          git config --global user.email "ci@privatecrates.dev"
          git config --global init.defaultBranch main
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Package the publishable crates
        run: cargo publish --dry-run --locked -p privatecrates-common -p privatecrates-auth -p cargo-credential-privatecrates -p cargo-privatecrates -p privatecrates-verify

  server:
    name: Rust, server (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # reads privatecrates-qos from the worldbuilding-dev registry
    defaults:
      run:
        working-directory: crates/privatecrates-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crates/privatecrates-server
            .
      - uses: ./.github/actions/private-registry
      - name: Configure git for the tests
        run: |
          git config --global user.name "PrivateCrates CI"
          git config --global user.email "ci@privatecrates.dev"
          git config --global init.defaultBranch main
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Includes the full-system tests of the client tools, which build them from the root workspace.
      - run: cargo test --locked

  advisories:
    name: Dependencies (RustSec advisories, licences, sources, notices)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the server's workspace reads the worldbuilding-dev registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - uses: ./.github/actions/private-registry
      - run: cargo deny --locked check
      - name: The server's workspace too
        run: cargo deny --locked --manifest-path crates/privatecrates-server/Cargo.toml --config deny.toml check
      # The release ships these with each binary; a dependency whose licence they cannot cover fails here first.
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Third-party licence notices generate
        run: |
          for name in cargo-credential-privatecrates cargo-privatecrates privatecrates-verify; do
            deploy/licenses/generate.sh "$name" "$RUNNER_TEMP/$name.txt"
          done

  msrv:
    name: Client tools on their minimum Rust (rust-version)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # What customers install with `cargo install`; the server has its own, higher rust-version.
      - run: cargo build --locked -p cargo-credential-privatecrates -p cargo-privatecrates -p privatecrates-verify

  postgres:
    name: Rust, server (Postgres records)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # reads privatecrates-qos from the worldbuilding-dev registry
    services:
      postgres:
        image: postgres:18@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
        env:
          POSTGRES_USER: privatecrates
          POSTGRES_PASSWORD: privatecrates
          POSTGRES_DB: privatecrates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privatecrates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/privatecrates-server
      - uses: ./.github/actions/private-registry
      # The SQL of our records: migrations, inserts, the conflict no-ops and lookups.
      - run: cargo test --test records --locked -- --ignored
        working-directory: crates/privatecrates-server
        env:
          DATABASE_URL: postgres://privatecrates:privatecrates@localhost:5432/privatecrates

  website:
    name: Website (check, lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip when there is no website yet
        if: hashFiles('website/package.json') == ''
        working-directory: .
        run: echo "::notice::website/ does not exist; skipping."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('website/package.json') != ''
        with:
          node-version: 24
      - name: Enable pnpm (corepack, the version in package.json's packageManager)
        if: hashFiles('website/package.json') != ''
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable && pnpm --version
      - if: hashFiles('website/package.json') != ''
        run: pnpm install --frozen-lockfile
      - if: hashFiles('website/package.json') != ''
        run: pnpm check
      - if: hashFiles('website/package.json') != ''
        run: pnpm lint
      - if: hashFiles('website/package.json') != ''
        run: pnpm build

  status:
    name: Status page (test, type-check, dry-run deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Did status/ change?
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; fi
          if [ "$EVENT" = push ]; then base="$PUSH_BEFORE"; fi
          # Manual runs, new branches and unknown bases check everything.
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- status .github/workflows/ci.yml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::status/ unchanged; skipping."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24
      - name: Enable pnpm (corepack, the version in package.json's packageManager)
        if: steps.changes.outputs.run == 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable && pnpm --version
      - if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build (incidents, fonts)
        if: steps.changes.outputs.run == 'true'
        run: pnpm build
      - name: Type-check (wrangler types, tsc)
        if: steps.changes.outputs.run == 'true'
        run: pnpm check
      - if: steps.changes.outputs.run == 'true'
        run: pnpm test
      - name: wrangler deploy --dry-run
        if: steps.changes.outputs.run == 'true'
        env:
          WRANGLER_SEND_METRICS: "false"
        run: pnpm deploy:dry-run

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # a one-hour registry token for the build, as Railway's build has PRIVATECRATES_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip when there is no website yet
        if: hashFiles('website/package.json') == ''
        run: echo "::notice::website/ does not exist; the image needs it, so the Docker build is skipped."
      - name: A read-only registry token for the build (the job's OIDC token, exchanged; masked, one hour)
        id: registry
        if: hashFiles('website/package.json') != ''
        env:
          REGISTRY: https://worldbuilding-dev.privatecrates.dev
        run: |
          oidc="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$REGISTRY" | jq -r .value)"
          token="$(curl -fsS -X POST -H "Authorization: Bearer $oidc" "$REGISTRY/api/v1/oidc/exchange" | jq -r .token)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: hashFiles('website/package.json') != ''
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: hashFiles('website/package.json') != ''
        with:
          context: .
          push: false
          load: true
          tags: privatecrates:ci
          build-args: PRIVATECRATES_TOKEN=${{ steps.registry.outputs.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and refuses to run without configuration
        if: hashFiles('website/package.json') != ''
        run: |
          if docker run --rm privatecrates:ci 2>err.txt; then
            echo "expected a configuration error" >&2
            exit 1
          fi
          cat err.txt
          grep -Eq 'Missing|not set' err.txt
