[package]
name = "privatecrates-testkit"
version = "0.1.0"
publish = false
description = "Fake GitHub and test fixtures for the PrivateCrates test suites."
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
aws-lc-rs = "1.18"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }

[lints]
workspace = true
