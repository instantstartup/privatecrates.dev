[package]
name = "cargo-privatecrates"
version = "0.2.2"
description = "Set up PrivateCrates private registries from the command line: sign in, onboard an organisation, configure crate repositories for trusted publishing, and check the result."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cargo", "registry", "github", "privatecrates", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
privatecrates-auth = { version = "0.2.2", path = "../privatecrates-auth" }
privatecrates-common = { version = "0.2.2", path = "../privatecrates-common" }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml_edit = "0.25.15"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
bytes = "1.12.1"
flate2 = "1.1.10"
privatecrates-server = { path = "../privatecrates-server" }
privatecrates-testkit = { path = "../privatecrates-testkit" }
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
