[package]
name = "cargo-privatecrates"
version = "0.2.9"
description = "Set up PrivateCrates private registries from the command line: sign in, onboard an organisation, configure crate repositories for trusted publishing, and check the result."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cargo", "registry", "github", "privatecrates", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
privatecrates-auth = { version = "0.2.9", path = "../privatecrates-auth" }
privatecrates-common = { version = "0.2.9", path = "../privatecrates-common" }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml_edit = "0.25.15"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
# Its tests against a real server are in privatecrates-server/tests (cli_*.rs), in the server's workspace.
tempfile = "3.27.0"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
