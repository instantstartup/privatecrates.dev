[package]
name = "privatecrates-server"
version = "0.1.0"
description = "The PrivateCrates hosted private Cargo registry server (source-available, Business Source License 1.1)."
license = "BUSL-1.1"
publish = false
edition.workspace = true
rust-version = "1.94"
repository.workspace = true
homepage.workspace = true

[dependencies]
aes-gcm = "0.11.1"
apollo-errors = "0.8.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
flate2 = "1.1.10"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
miette = "7"
moka = { version = "0.12.16", features = ["future"] }
privatecrates-common = { version = "0.2.3", path = "../privatecrates-common" }
privatecrates-verify = { version = "0.2.3", path = "../privatecrates-verify" }
reqwest = { version = "0.13.5", features = ["form", "json", "query"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs"] }
subtle = "2.6.1"
tar = "0.4.46"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
privatecrates-testkit = { path = "../privatecrates-testkit" }
tempfile = "3.27.0"
