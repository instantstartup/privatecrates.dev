[package]
name = "cargo-credential-privatecrates"
version = "0.2.10"
description = "Cargo credential provider for PrivateCrates private registries: GitHub device flow on developer machines, Actions OIDC in CI."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cargo", "credential-provider", "registry", "github", "oidc"]
categories = ["development-tools::cargo-plugins", "authentication", "command-line-utilities"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
cargo-credential = "0.4.10"
privatecrates-auth = { version = "0.2.10", path = "../privatecrates-auth" }
privatecrates-common = { version = "0.2.10", path = "../privatecrates-common" }
reqwest = { version = "0.13.5", features = ["blocking", "json", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = "0.3.55"
url = "2.5.8"

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# Its tests against a real server are in privatecrates-server/tests/credential_e2e.rs, in the server's workspace.
