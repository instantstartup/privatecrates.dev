[package]
name = "cargo-credential-privatecrates"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
cargo-credential = "0.4.10"
keyring = "4.2.0"
privatecrates-common = { version = "0.1.0", path = "../privatecrates-common" }
reqwest = { version = "0.13.5", features = ["blocking", "json", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = "0.3.55"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
flate2 = "1.1.10"
privatecrates-server = { path = "../privatecrates-server" }
privatecrates-testkit = { path = "../privatecrates-testkit" }
reqwest = "0.13.5"
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
