[package]
name = "cargo-credential-privatecrates"
version = "0.2.8"
description = "Cargo credential provider for PrivateCrates private registries: GitHub device flow on developer machines, Actions OIDC in CI."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cargo", "credential-provider", "registry", "github", "oidc"]
categories = ["development-tools::cargo-plugins", "authentication", "command-line-utilities"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
cargo-credential = "0.4.10"
privatecrates-auth = { version = "0.2.8", path = "../privatecrates-auth" }
privatecrates-common = { version = "0.2.8", path = "../privatecrates-common" }
reqwest = { version = "0.13.5", features = ["blocking", "json", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = "0.3.55"
url = "2.5.8"

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
flate2 = "1.1.10"
privatecrates-server = { path = "../privatecrates-server" }
privatecrates-testkit = { path = "../privatecrates-testkit" }
reqwest = "0.13.5"
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
