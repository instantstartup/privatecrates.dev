[package]
name = "privatecrates-verify"
version = "0.2.2"
description = "Verifies everything PrivateCrates wrote to a storage repository: append-only index, immutable releases and GitHub-signed provenance."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cargo", "registry", "provenance", "supply-chain", "verification"]
categories = ["development-tools", "command-line-utilities", "cryptography"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
privatecrates-common = { version = "0.2.2", path = "../privatecrates-common" }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dev-dependencies]
privatecrates-testkit = { path = "../privatecrates-testkit" }
tempfile = "3.27.0"
