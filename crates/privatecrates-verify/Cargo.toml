[package]
name = "privatecrates-verify"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
privatecrates-common = { version = "0.1.0", path = "../privatecrates-common" }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[lints]
workspace = true

[dev-dependencies]
privatecrates-testkit = { path = "../privatecrates-testkit" }
tempfile = "3.27.0"
