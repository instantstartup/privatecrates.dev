[package]
name = "privatecrates-auth"
version = "0.1.0"
description = "Signing in to PrivateCrates with GitHub's device flow, and keeping the token in the system keyring."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cargo", "registry", "github", "privatecrates", "device-flow"]
categories = ["authentication"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["blocking", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[lints]
workspace = true
