# `cargo deny check`, in CI on every push and daily: known vulnerabilities (RustSec), licences we may ship, and
# where dependencies come from.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported for the whole graph; yanked versions are errors.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

# Our unpublished crates (the server, under the Business Source Licence) are not checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
