<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- A plain-text summary for AI agents (llmstxt.org). -->
		<link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt" />
		<!-- Applies a saved theme before first paint. External, so it passes a `script-src 'self'` CSP. -->
		<script src="%sveltekit.assets%/theme.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
