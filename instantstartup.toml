name = "privatecrates"
ticket_prefix = "PC"
main_branches = ["dev"]

[build]
check = "cargo check --workspace --all-targets --locked"
fmt = "cargo fmt --all --check"
lint = "cargo clippy --workspace --all-targets --locked -- -D warnings"
test = "cargo test --workspace --locked && cd website && pnpm install --frozen-lockfile && pnpm run check && pnpm run lint && pnpm run build"
format = "cargo fmt --all && cd website && pnpm install --frozen-lockfile && pnpm run format"

[style]
paths = ["website/src"]
# Roles the website's palette uses beyond the built-in vocabulary: primary actions (--action), links,
# the preview notice band, rules between rows, checkbox and radio controls, and the illustration palette (scene).
role_words = ["action", "scene", "link", "notice", "divider", "control"]

[style.rules.non-semantic-token]
# The illustrations paint a harbour scene, so their palette is named for the scene's parts (sky, sea, hull…).
# Those names describe what is drawn rather than a UI role, which is right for a picture and only for a picture:
# these tokens are used by website/src/lib/illustrations alone. Listed one by one so no other token can use them.
allow = [
	"--scene-sky",
	"--scene-sky-low",
	"--scene-sea",
	"--scene-sea-light",
	"--scene-sea-light-ink",
	"--scene-hull",
	"--scene-quay",
	"--scene-rock",
	"--scene-grass",
	"--scene-foam",
	"--scene-lamp",
	"--scene-glint",
	"--scene-glare",
]

# The server workspace, as CI's `server` job builds it: crates/privatecrates-server is excluded from the root
# workspace (it alone reads the private instantstartup registry), so `check`, `lint` and `test` above never reach
# it. Only for a lane that changed what it builds from: the server (its Cargo.lock included), its path
# dependencies (privatecrates-common, -verify, -testkit), the client tools its full-system tests build from the
# root workspace (cargo-privatecrates, cargo-credential-privatecrates and their privatecrates-auth, with the root
# Cargo.toml and Cargo.lock), the website file its tests read (snippets.ts), the registry config, the scripts and
# this file. Paths must exist in the repository (a typo would skip the step on every lane). server-gate-test.sh
# first checks, with a fake cargo, that every call builds in the server's own target dir and can't prompt.
[[build.steps]]
name = "server"
command = "sh scripts/server-gate-test.sh && sh scripts/server-gate.sh"
paths = [
	"crates/privatecrates-server/",
	"crates/privatecrates-common/",
	"crates/privatecrates-verify/",
	"crates/privatecrates-testkit/",
	"crates/privatecrates-auth/",
	"crates/cargo-privatecrates/",
	"crates/cargo-credential-privatecrates/",
	"Cargo.toml",
	"Cargo.lock",
	"website/src/lib/snippets.ts",
	".cargo/config.toml",
	"scripts/server-gate.sh",
	"scripts/server-gate-test.sh",
	"instantstartup.toml",
]
